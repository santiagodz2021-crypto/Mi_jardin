<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi jardín</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2E7D4F">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F8EC;--card:#fff;--ink:#1F3326;--mut:#5C7263;--g:#2E7D4F;--gt:#fff;--gs:#DDEFD9;--earth:#9A6A35;--sun:#F2C14E;--line:#D5E2CB;--red:#B3402E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16231B;--card:#1F3126;--ink:#EAF3E4;--mut:#A3B8A8;--g:#6FCB8F;--gt:#10200F;--gs:#29412F;--earth:#D3A164;--line:#34503B;--red:#E37C6B}}
:root[data-theme="dark"]{--bg:#16231B;--card:#1F3126;--ink:#EAF3E4;--mut:#A3B8A8;--g:#6FCB8F;--gt:#10200F;--gs:#29412F;--earth:#D3A164;--line:#34503B;--red:#E37C6B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:600 20px/1.35 Nunito,system-ui,sans-serif;padding:16px 16px 120px;max-width:640px;margin-inline:auto}
h1{font-size:32px;font-weight:800;margin:8px 0 16px}h2{font-size:26px;font-weight:800;margin:0 0 12px}
.card,.item,.stats>div{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card[data-a]{cursor:pointer}.big{font-size:24px;display:block;margin-bottom:4px}
.tag{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;background:var(--gs);color:var(--g);font-size:17px;font-weight:800}
.tag.warn{background:var(--sun);color:#3B2E05}
.btn{display:block;width:100%;border:0;border-radius:16px;background:var(--g);color:var(--gt);font:800 21px Nunito,system-ui,sans-serif;padding:18px;margin:12px 0;cursor:pointer}
.btn.alt{background:var(--earth);color:#fff}.btn.ghost{background:transparent;color:var(--mut);border:2px solid var(--line)}
.row{display:flex;gap:10px}.row .btn{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats>div{text-align:center;padding:12px 6px;font-size:16px;color:var(--mut)}.stats b{display:block;font-size:22px;color:var(--ink)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.item small{display:block;color:var(--mut);font-size:16px}
.x{border:0;background:var(--gs);color:var(--red);font:800 20px Nunito,sans-serif;width:44px;height:44px;border-radius:12px;flex:none}
.back{border:0;background:none;color:var(--g);font:800 20px Nunito,sans-serif;padding:8px 0;cursor:pointer}
.empty,.hint{color:var(--mut)}.err{color:var(--red);font-weight:800;margin:4px 0}
.money{background:var(--g);color:var(--gt);border-radius:22px;padding:22px;text-align:center;margin-bottom:14px}.money b{display:block;font-size:42px;font-weight:800}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;text-transform:capitalize}.mnav button{border:2px solid var(--line);background:var(--card);color:var(--ink);width:52px;height:52px;border-radius:14px;font:800 22px Nunito,sans-serif}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}
nav button{flex:1;border:0;border-radius:14px;background:none;color:var(--mut);font:800 14px Nunito,sans-serif;padding:8px 2px;cursor:pointer}nav button span{display:block;font-size:26px}
nav button.on{background:var(--gs);color:var(--g)}
#sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center;z-index:9}
.box{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
label{display:block;margin-bottom:12px;color:var(--mut);font-size:17px}
input,select,textarea{display:block;width:100%;margin-top4px;margin-top:4px;font:600 22px Nunito,system-ui,sans-serif;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:130px}
.chips{display:flex;gap:8px;margin:-4px 0 12px}.chip{flex:1;border:2px solid var(--line);background:var(--card);color:var(--g);border-radius:12px;padding:10px;font:800 18px Nunito,sans-serif}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}.cal>b{text-align:center;color:var(--mut);font-size:15px}
.d{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;height:56px;font:800 19px Nunito,system-ui,sans-serif;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.d.o{visibility:hidden}.d.t{border-color:var(--g)}.d.s{background:var(--g);color:var(--gt)}
.dots{display:flex;gap:3px;height:8px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--g)}.dots i.r{background:var(--sun)}.d.s .dots i{background:var(--gt)}.d.s .dots i.r{background:var(--sun)}
.alert{background:var(--sun);color:#3B2E05;border-radius:16px;padding:12px 16px;margin-bottom:14px}.x.v{color:var(--g)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style></head><body>
<main id="app"></main>
<div id="sheet"></div>
<nav id="nav"></nav>
<script>
const K='jardin-v1',TIPOS=['Combustible','Máquinas','Herramientas','Plantas y abono','Desplazamiento','Otros'];
let S={casas:[],visitas:[],cobros:[],gastos:[],eventos:[],pct:20};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);
const eur=n=>(+n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const fd=s=>new Date(s+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab='casas',casaId=null,mes=today().slice(0,7),sample=null,P=[],sel=today(),cm=today().slice(0,7);
if(window.claude&&claude.use)claude.use('sample').then(s=>{sample=s;if($('#sheet').style.display!='flex')R()}).catch(()=>{});

const st=id=>{const v=S.visitas.filter(x=>x.casaId==id),c=S.cobros.filter(x=>x.casaId==id),last=c.map(x=>x.fecha).sort().pop();
 return{n:v.length,h:v.reduce((a,x)=>a+x.horas,0),cob:c.reduce((a,x)=>a+x.importe,0),last,pend:v.filter(x=>!last||x.fecha>last).length}};
const ahorro=()=>{const ap=S.cobros.reduce((a,x)=>a+x.importe*x.pct/100,0),ga=S.gastos.reduce((a,x)=>a+x.importe,0),co=S.cobros.reduce((a,x)=>a+x.importe,0);return{ap,ga,co,saldo:ap-ga}};

function sheet(t,f,ok,lbl='Guardar'){
 const el=$('#sheet');
 el.innerHTML=`<div class=box><h2>${t}</h2>${f.map(x=>`<label>${x.l}${x.t=='select'?`<select id=f_${x.k}>${x.o.map(o=>`<option ${o==x.v?'selected':''}>${o}</option>`).join('')}</select>`:`<input id=f_${x.k} type=${x.t=='date'?'date':x.t=='time'?'time':'text'} ${x.t=='num'?'inputmode=decimal':''} value="${esc(x.v??'')}">`}</label>${x.k=='pct'?'<div class=chips>'+[10,20,30,40].map(p=>`<button type=button class=chip data-p=${p}>${p}%</button>`).join('')+'</div>':''}`).join('')}<p id=pv class=hint></p><p id=err class=err></p><div class=row><button class="btn ghost" id=cx>Cancelar</button><button class=btn id=sv>${lbl}</button></div></div>`;
 el.style.display='flex';
 const get=()=>Object.fromEntries(f.map(x=>[x.k,x.t=='num'?parseFloat(String($('#f_'+x.k).value).replace(',','.')):$('#f_'+x.k).value.trim()]));
 const close=()=>{el.style.display='none';el.innerHTML=''};
 const pv=()=>{if(!f.some(x=>x.k=='pct'))return;const v=get();if(v.importe>0)$('#pv').textContent='Se apartan '+eur(v.importe*(v.pct||0)/100)+' para gastos'};
 el.oninput=pv;
 el.onclick=e=>{const c=e.target.closest('.chip');if(c){$('#f_pct').value=c.dataset.p;pv()}if(e.target==el)close()};
 $('#cx').onclick=close;
 $('#sv').onclick=()=>{const m=ok(get());if(m)$('#err').textContent=m;else{close();save();R()}};
 pv();
}
const ask=(msg,fn,l)=>sheet(msg,[],()=>{fn()},l||'Sí, borrar');

function vCasas(){
 if(casaId){const c=S.casas.find(x=>x.id==casaId);if(c)return vCasa(c);casaId=null}
 const l=S.casas.map(c=>{const s=st(c.id);return `<div class=card data-a=open data-id=${c.id}><b class=big>${esc(c.nombre)}</b><div>${s.n} visitas · ${s.h} h · cobrado ${eur(s.cob)}</div>${s.pend?`<span class="tag warn">${s.pend} ${s.pend==1?'visita sin cobrar':'visitas sin cobrar'}</span>`:s.n?`<span class=tag>Al día${s.last?' · último cobro '+fd(s.last):''}</span>`:''}</div>`}).join('');
 return `<h1>Mis casas</h1>${avisos()}${l||'<p class=empty>Todavía no hay casas. Pulsa el botón verde para añadir la primera.</p>'}<button class=btn data-a=addCasa>+ Añadir casa</button><button class="btn ghost" data-a=backup>Guardar copia de seguridad</button><button class="btn ghost" data-a=restore>Recuperar una copia</button>`;
}
function vCasa(c){
 const s=st(c.id),it=[...S.visitas.filter(x=>x.casaId==c.id).map(x=>({...x,k:'v'})),...S.cobros.filter(x=>x.casaId==c.id).map(x=>({...x,k:'c'}))].sort((a,b)=>b.fecha.localeCompare(a.fecha));
 return `<button class=back data-a=back>← Volver a las casas</button><h1>${esc(c.nombre)}</h1>
 <div class=stats><div><b>${s.n}</b>visitas</div><div><b>${s.h}</b>horas</div><div><b>${eur(s.cob)}</b>cobrado</div></div>
 <div class=row><button class=btn data-a=addVisita>Anotar visita</button><button class="btn alt" data-a=addCobro>Anotar cobro</button></div>
 ${it.map(x=>`<div class=item><div><b>${x.k=='v'?'Visita · '+x.horas+' h':'Cobro · '+eur(x.importe)}</b><small>${fd(x.fecha)}${x.k=='c'?' · aparta '+x.pct+'%':''}${x.nota?' · '+esc(x.nota):''}</small></div><button class=x data-a=del data-k=${x.k} data-id=${x.id} aria-label="Borrar">✕</button></div>`).join('')||'<p class=empty>Aún no hay visitas ni cobros en esta casa.</p>'}
 <button class="btn ghost" data-a=delCasa>Borrar esta casa</button>`;
}
function vGastos(){
 const g=S.gastos.filter(x=>x.fecha.startsWith(mes)).sort((a,b)=>b.fecha.localeCompare(a.fecha)),tot=g.reduce((a,x)=>a+x.importe,0),by={};
 g.forEach(x=>by[x.tipo]=(by[x.tipo]||0)+x.importe);
 const nm=new Date(mes+'-01T12:00').toLocaleDateString('es-ES',{month:'long',year:'numeric'});
 return `<h1>Gastos</h1><div class=mnav><button data-a=mm data-d=-1 aria-label="Mes anterior">‹</button><b>${nm}</b><button data-a=mm data-d=1 aria-label="Mes siguiente">›</button></div>
 <div class=money>Gastado este mes<b>${eur(tot)}</b></div>
 ${Object.keys(by).length?`<p class=hint>${Object.entries(by).map(([k,v])=>k+': '+eur(v)).join(' · ')}</p>`:''}
 <button class=btn data-a=addGasto>+ Anotar gasto</button>
 ${g.map(x=>`<div class=item><div><b>${esc(x.tipo)} · ${eur(x.importe)}</b><small>${fd(x.fecha)}${x.nota?' · '+esc(x.nota):''}</small></div><button class=x data-a=del data-k=g data-id=${x.id} aria-label="Borrar">✕</button></div>`).join('')||'<p class=empty>No hay gastos este mes.</p>'}`;
}
function vAhorro(){
 const a=ahorro(),cs=[...S.cobros].sort((x,y)=>y.fecha.localeCompare(x.fecha));
 return `<h1>Mi reserva</h1><div class=money>Te queda en la reserva<b>${eur(a.saldo)}</b></div>
 <div class=card>Cobrado en total: <b>${eur(a.co)}</b><br>Apartado para gastos: <b>${eur(a.ap)}</b><br>Gastos pagados: <b>${eur(a.ga)}</b></div>
 <p class=hint>La reserva es lo apartado de cada cobro menos los gastos que has anotado.</p>
 <button class="btn ghost" data-a=setPct>Porcentaje habitual: ${S.pct}% (cambiar)</button>
 ${cs.map(x=>{const c=S.casas.find(y=>y.id==x.casaId);return `<div class=item><div><b>${esc(c?c.nombre:'Casa borrada')} · ${eur(x.importe)}</b><small>${fd(x.fecha)} · apartado ${x.pct}% = ${eur(x.importe*x.pct/100)}</small></div></div>`}).join('')}`;
}
function vIA(){
 if(!sample)return `<h1>Ayuda</h1><p class=empty>El asistente no está disponible aquí. Puedes anotar todo a mano desde las otras pestañas.</p>`;
 return `<h1>Cuéntame y apunto</h1><p class=hint>Escribe o dicta con el micrófono del teclado. Ejemplo: «Hoy estuve 3 horas en casa de Marta y me pagó 60 euros. Gasté 15 en gasolina».</p>
 <label>Lo que has hecho<textarea id=iatxt></textarea></label><button class=btn data-a=ia>Apuntar</button><div id=iares></div>`;
}
const avisos=()=>{const t=today(),m=new Date(Date.now()+864e5),tm=new Date(m-m.getTimezoneOffset()*6e4).toISOString().slice(0,10),
 e=S.eventos.filter(x=>!x.hecho&&(x.fecha==t||x.fecha==tm)).sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.hora||'').localeCompare(b.hora||''));
 return e.length?`<div class=alert><b>Pendiente</b><br>${e.map(x=>(x.fecha==t?'Hoy':'Mañana')+(x.hora?' '+esc(x.hora):'')+': '+esc(x.titulo)).join('<br>')}</div>`:''};
function vAgenda(){
 const [y,m]=cm.split('-').map(Number),f1=new Date(y,m-1,1),off=(f1.getDay()+6)%7,n=new Date(y,m,0).getDate(),nm=f1.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
 let c='LMXJVSD'.split('').map(x=>`<b>${x}</b>`).join('')+'<span class="d o"></span>'.repeat(off);
 for(let i=1;i<=n;i++){const f=cm+'-'+String(i).padStart(2,'0'),e=S.eventos.filter(x=>x.fecha==f);
  c+=`<button class="d${f==today()?' t':''}${f==sel?' s':''}" data-a=sel data-f=${f}>${i}<span class=dots>${e.slice(0,3).map(x=>`<i class="${x.tipo=='r'?'r':''}"></i>`).join('')}</span></button>`}
 const ev=S.eventos.filter(x=>x.fecha==sel).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
 return `<h1>Agenda</h1><div class=mnav><button data-a=cmm data-d=-1 aria-label="Mes anterior">‹</button><b>${nm}</b><button data-a=cmm data-d=1 aria-label="Mes siguiente">›</button></div><div class=cal>${c}</div>
 <h2>${new Date(sel+'T12:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})}</h2>
 <div class=row><button class=btn data-a=addEv data-t=c>Reservar día</button><button class="btn alt" data-a=addEv data-t=r>Recordatorio</button></div>
 ${ev.map(x=>`<div class=item><b${x.hecho?' style="text-decoration:line-through;opacity:.6"':''}>${x.tipo=='r'?'🔔':'🏡'} ${x.hora?esc(x.hora)+' · ':''}${esc(x.titulo)}</b><div style="display:flex;gap:8px"><button class="x v" data-a=hecho data-id=${x.id} aria-label="Hecho">✓</button><button class=x data-a=delEv data-id=${x.id} aria-label="Borrar">✕</button></div></div>`).join('')||'<p class=empty>No hay nada apuntado este día.</p>'}`;
}
const desc=a=>{const d=fd(/^\d{4}-\d\d-\d\d$/.test(a.fecha)?a.fecha:today());
 return a.tipo=='visita'?`Visita · ${esc(a.casa)} · ${+a.horas} h · ${d}`:a.tipo=='cobro'?`Cobro · ${esc(a.casa)} · ${eur(a.importe)} · aparta ${+a.pct||S.pct}% · ${d}`:`Gasto · ${esc(a.categoria)} · ${eur(a.importe)} · ${d}`};
const mkp=t=>`Hoy es ${today()}. Eres el ayudante de un jardinero que apunta su trabajo. Casas conocidas: ${S.casas.map(c=>c.nombre).join(', ')||'ninguna'}. Porcentaje de ahorro habitual: ${S.pct}. Texto del jardinero: """${t}"""
Devuelve SOLO un JSON {"acciones":[...]}. Cada acción es {"tipo":"visita","casa":"nombre","horas":n,"fecha":"AAAA-MM-DD"} o {"tipo":"cobro","casa":"nombre","importe":n,"pct":n,"fecha":"AAAA-MM-DD"} o {"tipo":"gasto","categoria":"${TIPOS.join('|')}","importe":n,"nota":"texto","fecha":"AAAA-MM-DD"}. Usa la casa conocida más parecida. Si no hay nada que apuntar, {"acciones":[]}.`;

const VIEWS={casas:vCasas,agenda:vAgenda,gastos:vGastos,ahorro:vAhorro,ia:vIA},NAV=[['casas','🏡','Casas'],['agenda','📅','Agenda'],['gastos','🧾','Gastos'],['ahorro','🐷','Reserva'],['ia','💬','Ayuda']];
function R(){
 $('#app').innerHTML=VIEWS[tab]();
 $('#nav').innerHTML=NAV.filter(n=>n[0]!='ia'||sample).map(n=>`<button class="${tab==n[0]?'on':''}" data-a=tab data-t=${n[0]}><span>${n[1]}</span>${n[2]}</button>`).join('');
 scrollTo(0,0);
}
const cur=()=>S.casas.find(x=>x.id==casaId);
const A={
 tab:d=>{tab=d.t;casaId=null;R()},
 open:d=>{casaId=d.id;R()},back:()=>{casaId=null;R()},
 mm:d=>{const x=new Date(mes+'-01T12:00');x.setMonth(x.getMonth()+(+d.d));mes=x.toISOString().slice(0,7);R()},
 addCasa:()=>sheet('Nueva casa',[{k:'n',l:'Nombre o dirección',t:'text'}],v=>{if(!v.n)return 'Escribe un nombre.';S.casas.push({id:uid(),nombre:v.n})}),
 addVisita:()=>sheet('Anotar visita',[{k:'fecha',l:'Día',t:'date',v:today()},{k:'horas',l:'Horas trabajadas',t:'num'},{k:'nota',l:'Nota (opcional)',t:'text'}],v=>{if(!(v.horas>0))return 'Escribe las horas.';S.visitas.push({id:uid(),casaId,fecha:v.fecha||today(),horas:v.horas,nota:v.nota})}),
 addCobro:()=>sheet('Anotar cobro',[{k:'fecha',l:'Día',t:'date',v:today()},{k:'importe',l:'Importe cobrado (€)',t:'num'},{k:'pct',l:'% que quieres apartar',t:'num',v:S.pct},{k:'nota',l:'Nota (opcional)',t:'text'}],v=>{if(!(v.importe>0))return 'Escribe el importe.';const p=Math.min(100,Math.max(0,v.pct||0));S.pct=p;S.cobros.push({id:uid(),casaId,fecha:v.fecha||today(),importe:v.importe,pct:p,nota:v.nota})}),
 addGasto:()=>sheet('Anotar gasto',[{k:'tipo',l:'Qué has comprado',t:'select',o:TIPOS},{k:'importe',l:'Importe (€)',t:'num'},{k:'fecha',l:'Día',t:'date',v:today()},{k:'nota',l:'Nota (opcional)',t:'text'}],v=>{if(!(v.importe>0))return 'Escribe el importe.';S.gastos.push({id:uid(),tipo:v.tipo,importe:v.importe,fecha:v.fecha||today(),nota:v.nota})}),
 setPct:()=>sheet('Porcentaje habitual',[{k:'pct',l:'% a apartar de cada cobro',t:'num',v:S.pct}],v=>{if(v.pct==null||isNaN(v.pct))return 'Escribe un número.';S.pct=Math.min(100,Math.max(0,v.pct))}),
 del:d=>ask('¿Borrar esto?',()=>{const m={v:'visitas',c:'cobros',g:'gastos'}[d.k];S[m]=S[m].filter(x=>x.id!=d.id);save();R()}),
 delCasa:()=>ask('¿Borrar la casa y todo lo suyo?',()=>{S.casas=S.casas.filter(x=>x.id!=casaId);['visitas','cobros'].forEach(m=>S[m]=S[m].filter(x=>x.casaId!=casaId));casaId=null;save();R()}),
 sel:d=>{sel=d.f;R()},
 cmm:d=>{const x=new Date(cm+'-01T12:00');x.setMonth(x.getMonth()+(+d.d));cm=x.toISOString().slice(0,7);R()},
 addEv:d=>{const c=d.t=='c';sheet(c?'Reservar día':'Nuevo recordatorio',[...(c&&S.casas.length?[{k:'casa',l:'Casa',t:'select',o:S.casas.map(x=>x.nombre)}]:[]),{k:'fecha',l:'Día',t:'date',v:sel},{k:'hora',l:'Hora (opcional)',t:'time'},{k:'txt',l:c?'Nota (opcional)':'Qué hay que recordar',t:'text'}],v=>{const ti=c?[v.casa,v.txt].filter(Boolean).join(' · '):v.txt;if(!ti)return c?'Añade una casa o una nota.':'Escribe el recordatorio.';S.eventos.push({id:uid(),fecha:v.fecha||sel,tipo:d.t,titulo:ti,hora:v.hora});sel=v.fecha||sel;cm=sel.slice(0,7)})},
 hecho:d=>{const e=S.eventos.find(x=>x.id==d.id);if(e)e.hecho=!e.hecho;save();R()},
 delEv:d=>ask('¿Borrar esto?',()=>{S.eventos=S.eventos.filter(x=>x.id!=d.id);save();R()}),
 backup:()=>{try{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mi-jardin-copia-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}catch(e){alert('No se ha podido guardar la copia.')}},
 restore:()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d||!Array.isArray(d.casas))throw 0;ask('Esto sustituye lo que hay ahora en la app. ¿Seguro?',()=>{S=Object.assign({casas:[],visitas:[],cobros:[],gastos:[],eventos:[],pct:20},d);save();R()},'Sí, recuperar')}).catch(()=>alert('Ese archivo no es una copia válida.'))};i.click()},
 ia:async()=>{const t=$('#iatxt').value.trim(),out=$('#iares');if(!t)return;out.innerHTML='<p class=hint>Pensando…</p>';
  try{const r=await sample.json(mkp(t),{cache:false});P=(r.acciones||[]).filter(a=>a&&['visita','cobro','gasto'].includes(a.tipo));
   out.innerHTML=P.length?`<div class=card>${P.map(desc).join('<br>')}</div><button class=btn data-a=iaOk>Guardar todo</button>`:'<p class=empty>No he entendido nada que apuntar. Prueba a contarlo de otra forma.</p>'}
  catch(e){out.innerHTML='<p class=err>Ahora no se puede usar el asistente. Inténtalo otra vez o apunta a mano.</p>'}},
 iaOk:()=>{const cid=n=>{n=String(n||'').trim()||'Sin nombre';let c=S.casas.find(x=>x.nombre.toLowerCase()==n.toLowerCase());if(!c){c={id:uid(),nombre:n};S.casas.push(c)}return c.id};
  P.forEach(a=>{const f=/^\d{4}-\d\d-\d\d$/.test(a.fecha)?a.fecha:today(),n=+(a.tipo=='visita'?a.horas:a.importe);if(!(n>0))return;
   if(a.tipo=='visita')S.visitas.push({id:uid(),casaId:cid(a.casa),fecha:f,horas:n,nota:''});
   else if(a.tipo=='cobro')S.cobros.push({id:uid(),casaId:cid(a.casa),fecha:f,importe:n,pct:Math.min(100,Math.max(0,isNaN(+a.pct)?S.pct:+a.pct)),nota:''});
   else S.gastos.push({id:uid(),tipo:TIPOS.includes(a.categoria)?a.categoria:'Otros',importe:n,fecha:f,nota:String(a.nota||'')})});
  P=[];save();R();$('#app').insertAdjacentHTML('afterbegin','<p class=tag>Apuntado ✓</p>')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset)});
